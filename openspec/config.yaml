schema: spec-driven

context: |
  Projeto: Odonto_Uni (Sistema de Gestão da Clínica-Escola de Odontologia - UniCatólica).
  Stack Backend: Java 25, Spring Boot 4, Spring Data JPA, Flyway (migrations até V15), PostgreSQL, Spring Security com sessão HTTP e CSRF.
  Stack Frontend: React 19 (Vite), Axios e CSS modular.
  Atores autenticados neste fluxo: ALUNO, SECRETARIA e COORDENADOR (Paciente é entidade passiva).
  Regras críticas do banco (V5, V8 e V14):
  - Tabela `cadeiras` (id, numero, ativa) e `vagas` (id, cadeira_id, data, turno ['MANHA'|'TARDE'], bloqueada, motivo_bloqueio) com constraint `uk_vaga (cadeira_id, data, turno)`.
  - Tabela `consultas` possui índice único parcial `uk_consulta_vaga_ativa` impedindo duas consultas ativas na mesma vaga e `@Version` (optimistic locking).
  - Trigger `trg_consulta_historico` exige `SELECT set_config('app.origem', 'SECRETARIA', true)` e `SELECT set_config('app.usuario_id', '<id>', true)` na transação antes de inserir/atualizar `consultas`.
  - Não usar API externa paga do WhatsApp; flags de notificação devem apenas registrar/simular aviso interno.

rules:
  proposal:
    - "Preservar os contratos e componentes existentes fora do escopo explícito da mudança."
  specs:
    - "Separar comportamentos de autenticação e recuperação em capacidades verificáveis."
  tasks:
    - "Decompor tarefas por camadas e registrar a validação executada."
