# Perfil local de desenvolvimento. Ative com --spring.profiles.active=local.
# Sobrescreve a conexão padrão para que Flyway/JPA não usem o banco remoto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/odontologia_local}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logs estruturados do codigo de recuperacao somente no perfil local.
app.auth.recovery.log-code=${AUTH_RECOVERY_LOG_CODE:true}
