spring.application.name=odontologia-api

# Conexão com o Banco de Dados PostgreSQL (com valor padrão)
spring.datasource.url=jdbc:postgresql://localhost:8080/unicatolica_odonto
spring.datasource.username=$postgres
spring.datasource.password=$999175174
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration