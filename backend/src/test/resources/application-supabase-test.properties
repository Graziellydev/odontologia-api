# Perfil sem migrações nem DDL automáticos; valida o mapeamento contra o schema Supabase existente.
spring.datasource.url=${SUPABASE_TEST_JDBC_URL:${DB_URL}}
spring.datasource.username=${SUPABASE_TEST_USERNAME:${SUPABASE_TEST_DB_USERNAME:${DB_USERNAME}}}
spring.datasource.password=${SUPABASE_TEST_PASSWORD:${SUPABASE_TEST_DB_PASSWORD:${DB_PASSWORD}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
logging.level.org.springframework.jdbc.core=INFO
